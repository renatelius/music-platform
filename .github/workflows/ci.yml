name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TURBO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Start infrastructure
        run: |
          docker compose -f infrastructure/docker/compose.yaml --env-file .env up -d --quiet-pull --wait --wait-timeout 180
          docker compose -f infrastructure/docker/compose.yaml --env-file .env --profile init run --rm --quiet-pull s3-init
      - name: Check PostgreSQL extensions
        run: |
          docker compose -f infrastructure/docker/compose.yaml --env-file .env exec -T postgres \
            psql -U mp -d mp_test -At -c "select count(*) from pg_extension where extname in ('vector','pg_trgm','citext','unaccent')" \
            | grep -qx 4
      - run: pnpm format:check
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git status --porcelain apps/api/drizzle
          test -z "$(git status --porcelain apps/api/drizzle)"
      - run: pnpm check
      - if: always()
        run: docker compose -f infrastructure/docker/compose.yaml --env-file .env down -v
