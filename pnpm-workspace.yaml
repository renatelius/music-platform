packages:
  - apps/*
  - packages/*
  - tools/*

# Single source of truth for shared dependency versions.
# Use "catalog:" as the version in any package.json.
catalog:
  '@eslint/js': ^10.0.1
  '@tailwindcss/postcss': ^4.3.0
  '@types/node': ^26.6.6
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  eslint: ^10.14.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.0.0
  globals: ^17.14.0
  next: ^16.4.5
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.0
  turbo: ^2.11.10
  # Pinned to 6.0.x: typescript-eslint does not support TypeScript 7 yet (see ADR-004).
  typescript: ~6.0.3
  typescript-eslint: ^8.72.1
  vitest: ^5.1.0
  zod: ^4.6.7

# Packages allowed to run install scripts.
allowBuilds:
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true
  # Not needed: native prebuilds come from @msgpackr-extract/* optional packages
  # (msgpackr via BullMQ); the install script only rebuilds when a prebuild is missing.
  msgpackr-extract: false

# Fresh releases we adopted before pnpm's minimum release age (reviewed manually).
minimumReleaseAgeExclude:
  - '@nestjs/common@12.3.3'
  - '@nestjs/core@12.3.3'
  - '@nestjs/platform-express@12.3.3'

# Do not fail install on dependencies with build scripts that are not explicitly approved.
strictDepBuilds: false
